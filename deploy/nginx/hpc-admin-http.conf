# 完整站点示例：从 nginx.conf 的 http 块加载本文件。
# 管理端目录必须指向 dist，不能指向包含 config.yaml 的发布根目录。
# 修改安装位置时同步修改 root 和 include；域名部署时替换 server_name。
# 宝塔已有站点：不要粘贴此 server 块，只使用 hpc-admin-rules.inc。
server {
    listen 80;
    server_name _;
    root /www/wwwroot/hpc_manager_server/dist;
    index index.html;

    include /www/wwwroot/hpc_manager_server/deploy/nginx/hpc-admin-rules.inc;
}
