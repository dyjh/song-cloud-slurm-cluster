# 完整站点示例：从 nginx.conf 的 http 块加载本文件。
# 用户端按独立站点根路径部署，目录指向 front-dist。
# config.yaml 中 front.public-origin 填浏览器实际入口，例如 http://服务器IP:5174。
# 修改安装位置时同步修改 root 和 include；域名部署时替换 server_name。
# 宝塔已有站点：不要粘贴此 server 块，只使用 hpc-front-rules.inc。
server {
    listen 5174;
    server_name _;
    root /www/wwwroot/hpc_manager_server/front-dist;
    index index.html;

    include /www/wwwroot/hpc_manager_server/deploy/nginx/hpc-front-rules.inc;
}
